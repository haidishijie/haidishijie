<!-- Saved from UI designer's redesign for reference -->
<html lang="zh-CN">
<head>
<style>
/* ── Reset & Base ── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
body{
  font-family:'Inter','SF Pro Display',system-ui,-apple-system,sans-serif;
  background:#0a0e17;
  color:#e0e7ff;
  min-height:100vh;
  overflow-x:hidden;
}
/* Subtle background glow */
body::before{
  content:'';position:fixed;inset:0;
  background:
    radial-gradient(ellipse 70% 50% at 50% -5%, rgba(56,189,248,0.05) 0%, transparent 60%),
    radial-gradient(ellipse 50% 40% at 80% 85%, rgba(34,211,238,0.03) 0%, transparent 50%);
  pointer-events:none;z-index:0;
}
/* Scan line effect */
body::after{
  content:'';position:fixed;inset:0;
  background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,212,255,.01) 2px,rgba(0,212,255,.01) 4px);
  pointer-events:none;z-index:0;
}
/* ── Layout ── */
.app{position:relative;z-index:1;max-width:1440px;margin:0 auto;padding:0 24px 32px}
/* ── Top Bar ── */
.topbar{
  display:flex;align-items:center;gap:12px;
  padding:14px 0;border-bottom:1px solid rgba(30,58,95,.6);
  margin-bottom:20px;
}
.topbar-brand{
  display:flex;align-items:center;gap:8px;
  font-size:15px;font-weight:600;color:#e0e7ff;
  letter-spacing:-0.01em;
}
.topbar-brand .logo{
  width:20px;height:20px;background:#1e3a5f;border-radius:4px;
  display:flex;align-items:center;justify-content:center;
  font-size:12px;color:#00d4ff;
}
.topbar-brand span{color:rgba(255,255,255,.25);font-weight:400;margin-left:2px}
.topbar-nav{display:flex;gap:2px;margin-left:24px}
.topbar-nav a{
  padding:4px 14px;border-radius:4px;
  font-size:12px;font-weight:500;color:rgba(255,255,255,.35);
  text-decoration:none;transition:all .15s;
  letter-spacing:.02em;
}
.topbar-nav a:hover{color:#e0e7ff;background:rgba(255,255,255,.04)}
.topbar-nav a.active{color:#00d4ff;background:rgba(0,212,255,.1)}
.topbar-right{display:flex;align-items:center;gap:14px;margin-left:auto}
</style>
</head>
<body>
  <div class="app">
    ... (full redesign HTML saved to redesign-v2.html)
  </div>
</body>
</html>
